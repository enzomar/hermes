[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-workbench"
version = "0.1.0"
description = "Hermes: a streaming MCP AI IDE workbench backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "litellm>=1.55.0",
  "mcp>=1.9.0",
  "orjson>=3.10.0",
  "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "llm*", "mcp*", "replay*", "ui*", "lab*"]

[tool.ruff]
line-length = 100
target-version = "py310"
